# DigitalOcean App Platform spec. Create the app from this file, then set the SECRET values in the dashboard.
name: inkwell
services:
  - name: web
    github:
      repo: YOUR_GITHUB_USER/inkwell   # TODO: set after creating the GitHub repo
      branch: main
      deploy_on_push: true
    environment_slug: node-js
    build_command: npm ci && npm run build
    run_command: npm run start
    http_port: 8080
    instance_size_slug: apps-s-1vcpu-1gb
    instance_count: 1
    health_check:
      http_path: /api/health
    envs:
      - { key: NODE_ENV, value: production }
      - { key: PORT, value: "8080" }
      - { key: DATABASE_URL, value: "file:./data/inkwell.db" }
      - { key: PIPELINE_VERSION, value: v1 }
      - { key: DEMO_MODE, value: "false" }
      - { key: GEMINI_MODEL_TRANSCRIBE, value: gemini-3.8-flash }
      - { key: GEMINI_MODEL_TEXT, value: gemini-3.8-flash }
      - { key: GEMINI_MODEL_PRO, value: gemini-3.1-pro-preview }
      - { key: GEMINI_MODEL_FALLBACK, value: gemini-3.5-flash-lite }
      - { key: ELEVENLABS_MODEL_ID, value: eleven_multilingual_v2 }
      - { key: GEMINI_API_KEY, type: SECRET }
      - { key: ELEVENLABS_API_KEY, type: SECRET }
      - { key: ELEVENLABS_VOICE_ID, type: SECRET }
